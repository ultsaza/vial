name: Render Cornix keymap

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cornix/main.vil"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/**/*.rs"
      - "tests/**"
      - "docs/cornix-keymap.svg"
      - ".github/workflows/render-keymap.yml"
  push:
    branches:
      - master
    paths:
      - "cornix/main.vil"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/**/*.rs"
      - "tests/**"
      - "docs/cornix-keymap.svg"
      - ".github/workflows/render-keymap.yml"

concurrency:
  group: render-keymap-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy

      - name: Check formatting and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Test renderer
        run: cargo test --locked

      - name: Render keymap
        run: cargo run --locked -- cornix/main.vil docs/cornix-keymap.svg

      - name: Upload generated diagram for review
        uses: actions/upload-artifact@v7
        with:
          name: cornix-keymap
          path: docs/cornix-keymap.svg
          if-no-files-found: error

  update:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy

      - name: Check formatting and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Test renderer
        run: cargo test --locked

      - name: Render keymap
        run: cargo run --locked -- cornix/main.vil docs/cornix-keymap.svg

      - name: Commit updated diagram
        run: |
          if git diff --quiet -- docs/cornix-keymap.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cornix-keymap.svg
          git commit -m "docs: regenerate Cornix keymap [skip ci]"
          git push
