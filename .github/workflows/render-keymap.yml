name: Render Cornix keymap

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cornix/main.vil"
      - "scripts/render_keymap.py"
      - "tests/test_render_keymap.py"
      - ".github/workflows/render-keymap.yml"
  push:
    branches:
      - master
    paths:
      - "cornix/main.vil"
      - "scripts/render_keymap.py"
      - "tests/test_render_keymap.py"
      - ".github/workflows/render-keymap.yml"

concurrency:
  group: render-keymap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test renderer
        run: python3 -m unittest discover -s tests -v

      - name: Render keymap
        run: python3 scripts/render_keymap.py cornix/main.vil docs/cornix-keymap.svg

      - name: Verify generated diagram is current
        run: git diff --exit-code -- docs/cornix-keymap.svg

  update:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test renderer
        run: python3 -m unittest discover -s tests -v

      - name: Render keymap
        run: python3 scripts/render_keymap.py cornix/main.vil docs/cornix-keymap.svg

      - name: Commit updated diagram
        run: |
          if git diff --quiet -- docs/cornix-keymap.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cornix-keymap.svg
          git commit -m "docs: regenerate Cornix keymap [skip ci]"
          git push
